<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="permissionTitle">Permission Required</title>
    <style>
      :root {
        --bg-main: #1e1e1e;
        --bg-panel: #2a2a2a;
        --text-main: #e0e0e0;
        --text-muted: #9e9e9e;
        --accent: #4caf50;
        --border: #3f3f3f;
      }

      body {
        font-family: system-ui, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        padding: 40px 20px;
        margin: 0;
      }

      .container {
        background-color: var(--bg-panel);
        width: 100%;
        max-width: 500px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        text-align: center;
      }

      h1 {
        margin-top: 0;
        font-size: 1.5rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 15px;
      }

      p {
        color: var(--text-muted);
        line-height: 1.6;
      }

      button {
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 12px 32px;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 10px;
      }

      button:hover {
        background-color: #45a049;
      }

      #status {
        margin-top: 15px;
        color: #f44336;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 data-i18n="permissionTitle">Permission Required</h1>
      <p data-i18n="permissionExplanation">
        This extension needs permission to access images on websites so it can
        save them in your chosen format.
      </p>
      <button id="grant-btn" data-i18n="permissionGrant">
        Grant Permission
      </button>
      <div id="status"></div>
    </div>

    <script src="permissions.js"></script>
  </body>
</html>
