<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="extName">Options</title>
    <style>
      :root {
        --bg-main: #1e1e1e;
        --bg-panel: #2a2a2a;
        --text-main: #e0e0e0;
        --text-muted: #9e9e9e;
        --accent: #4caf50;
        --border: #3f3f3f;
      }

      body {
        font-family: system-ui, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        padding: 40px 20px;
        margin: 0;
      }

      .container {
        background-color: var(--bg-panel);
        width: 100%;
        max-width: 500px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }

      h1 {
        margin-top: 0;
        font-size: 1.5rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 15px;
      }

      .setting-group {
        margin-bottom: 25px;
      }

      .setting-group > label.block-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--text-main);
      }

      input[type="text"],
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        background-color: var(--bg-main);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-main);
        font-family: inherit;
      }

      input[type="text"]:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
      }

      /* Modern Toggle Switch */
      .toggle-label {
        display: flex;
        align-items: center;
        cursor: pointer;
        margin-bottom: 10px;
      }

      .toggle-label input[type="checkbox"] {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 20px;
        background-color: var(--border);
        border-radius: 20px;
        margin-right: 12px;
        transition: 0.3s;
      }

      .slider:before {
        content: "";
        position: absolute;
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        border-radius: 50%;
        transition: 0.3s;
      }

      input:checked + .slider {
        background-color: var(--accent);
      }

      input:checked + .slider:before {
        transform: translateX(20px);
      }

      /* Action Footer */
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }

      button {
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: #45a049;
      }

      #status {
        opacity: 0;
        color: var(--accent);
        transition: opacity 0.3s;
        font-weight: 600;
      }

      #status.show {
        opacity: 1;
      }

      .footer-link {
        text-align: center;
        margin-top: 20px;
      }

      .footer-link a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
      }

      .footer-link a:hover {
        color: var(--text-main);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 data-i18n="Open_options">⚙️ Options</h1>
      <form id="options-form">
        <div class="setting-group">
          <label class="toggle-label">
            <input type="checkbox" id="download-instantly" />
            <span class="slider"></span>
            <span data-i18n="optDownloadInstantly"
              >Download without confirmation dialog</span
            >
          </label>
        </div>

        <div class="setting-group">
          <label class="block-label" data-i18n="optContextMenuLabels"
            >Context menu labels to show:</label
          >
          <label class="toggle-label">
            <input type="checkbox" name="context-menu-labels" value="JPG" />
            <span class="slider"></span> JPG
          </label>
          <label class="toggle-label">
            <input type="checkbox" name="context-menu-labels" value="PNG" />
            <span class="slider"></span> PNG
          </label>
          <label class="toggle-label">
            <input type="checkbox" name="context-menu-labels" value="WebP" />
            <span class="slider"></span> WebP
          </label>
          <label class="toggle-label">
            <input type="checkbox" name="context-menu-labels" value="GIF" />
            <span class="slider"></span> GIF
          </label>
        </div>

        <div class="setting-group">
          <label
            for="default-filename"
            class="block-label"
            data-i18n="optDefaultFilename"
            >Default filename:</label
          >
          <input type="text" id="default-filename" placeholder="-" />
        </div>

        <div class="setting-group">
          <label class="toggle-label">
            <input type="checkbox" id="enable-max-length" />
            <span class="slider"></span>
            <span data-i18n="optEnableMaxLength">Limit filename length</span>
          </label>

          <div
            id="max-length-container"
            style="
              margin-top: 10px;
              opacity: 0.5;
              pointer-events: none;
              transition: opacity 0.2s;
            "
          >
            <label
              for="max-length"
              data-i18n="optMaxLengthValue"
              style="
                display: inline-block;
                margin-right: 10px;
                font-weight: 600;
              "
              >Max length:</label
            >
            <input
              type="range"
              id="max-length"
              min="1"
              max="255"
              value="255"
              style="vertical-align: middle; width: 200px"
            />
            <span
              id="max-length-display"
              style="
                display: inline-block;
                width: 30px;
                text-align: right;
                font-weight: bold;
                color: var(--accent);
              "
              >255</span
            >
          </div>
        </div>

        <div class="actions">
          <button type="submit" data-i18n="optSave">Save</button>
          <span id="status" data-i18n="optSavedSuccess">Options saved.</span>
        </div>
      </form>

      <div class="footer-link">
        <a
          href="https://github.com/S4adam/Save-Image-as-Type-2024"
          target="_blank"
          data-i18n="optViewGithub"
          >View this fork on GitHub</a
        >
      </div>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
